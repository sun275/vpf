[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpf"
version = "0.1.0"
description = "VPF vision backbone for classification and dense prediction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "einops>=0.8,<0.9",
  "timm>=1.0,<1.1",
  "torch>=2.0",
]

[project.optional-dependencies]
classification = ["fvcore", "tensorboardX", "termcolor", "yacs"]
openmmlab = [
  "mmcv==2.1.0",
  "mmdet==3.3.0",
  "mmengine==0.10.1",
  "mmsegmentation==1.2.2",
  "mmpretrain==1.2.0",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
