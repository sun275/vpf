[metadata]
name = vpf
version = 0.1.0
description = VPF vision backbone for classification and dense prediction
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    einops>=0.8,<0.9
    timm>=1.0,<1.1
    torch>=2.0

[options.packages.find]
where = src
